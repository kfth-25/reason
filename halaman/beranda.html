<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C6BF0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="pwa.js" defer></script>
<title>Harian — Beranda</title>
<style>
  /* ============ PALET & TOKEN ============ */
  :root{
    --blue:#4392F0;        /* palet utama */
    --blue-deep:#2E7BD6;
    --blue-soft:#D6E8FF;
    --purple:#B7A6F6;
    --purple-soft:#EFEAFD;
    --orange:#F5A93F;
    --pink:#F9A9E8;
    --pink-soft:#FCE3F8;
    --green:#C5EE93;
    --cyan:#3DD3F6;
    --lavender:#D8D2F3;

    --bg:#F6F6F9;
    --card:#FFFFFF;
    --text:#15161C;
    --muted:#8A8B98;
    --line:#ECECF1;
    --nav-dark:#15161C;

    --r-card:22px;
    --r-pill:999px;
    --shadow:0 8px 24px rgba(20,22,40,.07);
    --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#1A2434;
    --card:#152030;
    --text:#F2F4F8;
    --muted:#8B97AB;
    --line:#253147;
    --nav-dark:#0F1724;
    --blue-soft:#1E3A5F;
    --purple-soft:#2A2750;
    --pink-soft:#402A45;
    --shadow:0 8px 24px rgba(0,0,0,.28);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:#DDE1EA;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  @media (max-width:520px){ body{padding:0} }

  /* ============ PHONE FRAME ============ */
  .phone{
    width:390px;height:844px;max-height:100vh;
    background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 11px #111318,0 0 0 13px #2a2d35;
    transition:background .3s;
  }
  @media (max-width:520px){
    .phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
  }
  .notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:118px;height:34px;background:#0B0D12;border-radius:20px;z-index:60;
  }
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:52px;z-index:55;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px 0;font-size:14px;font-weight:600;color:var(--text);
    pointer-events:none;
  }
  .statusbar .sb-icons{display:flex;gap:6px;align-items:center}
  .sb-icons svg{width:16px;height:16px;fill:var(--text)}

  /* ============ SCREEN SYSTEM ============ */
  .screen{
    position:absolute;inset:0;padding-top:52px;
    overflow-y:auto;overflow-x:hidden;
    padding-bottom:110px;
    opacity:0;visibility:hidden;transform:translateX(18px);
    transition:opacity .32s ease,transform .32s ease,visibility .32s;
    -webkit-overflow-scrolling:touch;
  }
  .screen.active{opacity:1;visibility:visible;transform:translateX(0)}
  .screen::-webkit-scrollbar{display:none}
  .pad{padding:0 20px}

  /* ============ BOTTOM NAV (pill gelap) ============ */
  .nav{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--nav-dark);border-radius:var(--r-pill);
    display:flex;gap:6px;padding:8px;z-index:50;
    box-shadow:0 12px 32px rgba(0,0,0,.28);
  }
  .nav button{
    width:58px;height:58px;border:none;border-radius:50%;
    background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s;
  }
  .nav button svg{width:23px;height:23px;stroke:#7C8496;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
  .nav button.on{background:#F6F6F9}
  .nav button.on svg{stroke:#15161C}
  .home-ind{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:130px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:50;
  }

  /* ============ SHARED BITS ============ */
  .pill-btn{
    border:none;font-family:var(--font);cursor:pointer;
    border-radius:var(--r-pill);font-weight:600;transition:transform .15s,filter .2s;
  }
  .pill-btn:active{transform:scale(.96)}
  .sec-title{font-size:21px;font-weight:700;color:var(--text);margin:22px 0 14px}
  .chip{
    border:none;font-family:var(--font);cursor:pointer;
    padding:8px 15px;border-radius:var(--r-pill);
    font-size:13px;font-weight:600;color:var(--text);
    background:var(--card);transition:all .2s;
  }
  .chip.on{background:var(--blue);color:#fff}
  .avatars{display:flex}
  .avatars span{
    width:30px;height:30px;border-radius:50%;margin-left:-8px;
    border:2px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;
  }
  .avatars span:first-child{margin-left:0}
  .avatars .more{background:#8B7BD8}

  /* ============ 1 · BERANDA ============ */
  .home-head{display:flex;align-items:center;gap:12px;padding-top:14px}
  .home-head .ava{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#F5A93F,#F9A9E8);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .home-head .hello{flex:1;text-align:center}
  .home-head .hello b{display:block;font-size:16px;font-weight:700;color:var(--text)}
  .home-head .hello span{font-size:13px;color:var(--muted)}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:var(--card);display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .icon-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}

  .challenge{
    margin-top:18px;background:var(--purple);border-radius:var(--r-card);
    padding:22px 20px;position:relative;overflow:hidden;min-height:170px;
    color:#15161C;
  }
  .challenge h2{font-size:30px;font-weight:700;line-height:1.1;max-width:60%}
  .challenge p{font-size:12.5px;font-weight:600;margin-top:8px;max-width:62%}
  .challenge .avatars{margin-top:14px}
  .blob{position:absolute;pointer-events:none}
  .blob.b1{width:86px;height:86px;border-radius:50% 50% 45% 55%;background:var(--orange);right:24px;top:18px;transform:rotate(18deg);box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
  .blob.b2{width:58px;height:58px;border-radius:50%;background:#5E6B78;right:96px;top:66px;box-shadow:inset -6px -6px 0 rgba(0,0,0,.15)}
  .blob.b3{width:40px;height:40px;border-radius:50%;background:var(--green);right:44px;top:96px;box-shadow:inset -5px -5px 0 rgba(0,0,0,.1)}
  .blob.b4{width:44px;height:44px;border-radius:50%;border:9px solid #F5E94E;right:118px;top:104px}

  .date-strip{display:flex;gap:7px;margin-top:18px;justify-content:space-between}
  .day{
    flex:1;border:1.5px solid var(--line);border-radius:26px;
    background:var(--card);cursor:pointer;text-align:center;
    padding:10px 0 8px;transition:all .22s;font-family:var(--font);
  }
  .day small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .day b{display:block;font-size:15px;color:var(--text);margin-top:3px;font-weight:700}
  .day.on{background:var(--nav-dark);border-color:var(--nav-dark)}
  .day.on small,.day.on b{color:#F6F6F9}

  .plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .plan-card{border-radius:var(--r-card);padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
  .plan-card:active{transform:scale(.97)}
  .tag{
    display:inline-block;font-size:11px;font-weight:600;
    background:rgba(255,255,255,.65);border-radius:var(--r-pill);padding:4px 12px;color:#15161C;
  }
  .plan-card h3{font-size:20px;font-weight:700;color:#15161C;margin-top:12px}
  .plan-card .subj{font-size:12px;font-weight:600;color:#15161C;opacity:.7;margin-top:3px}
  .plan-card .meta{font-size:12.5px;color:#15161C;opacity:.85;margin-top:8px;line-height:1.55}
  .plan-card.big{grid-row:span 2;background:var(--orange);display:flex;flex-direction:column}
  .plan-card.big .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:14px}
  .plan-card.big .foot .t{font-size:10.5px;color:#15161C;opacity:.75}
  .plan-card.big .foot .n{font-size:13px;font-weight:700;color:#15161C}
  .plan-card.small{background:var(--blue-soft)}
  .plan-card.social{background:var(--pink);display:flex;align-items:center;gap:10px;padding:16px 14px}
  .soc{
    width:42px;height:42px;border-radius:50%;background:var(--pink-soft);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;
  }
  .soc:active{transform:scale(.9)}
  .soc svg{width:19px;height:19px;fill:#C74FB4}

  /* ============ 2 · FOKUS ============ */
  .focus-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
  .focus-top .greet b{font-size:17px;font-weight:700;color:var(--text);display:block}
  .focus-top .greet span{font-size:13px;color:var(--muted)}
  .streak{
    display:flex;align-items:center;gap:5px;background:var(--card);
    border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:700;
    color:var(--text);box-shadow:var(--shadow);
  }
  .focus-stage{
    margin-top:18px;background:var(--blue-soft);border-radius:var(--r-card);
    padding:26px 20px 0;text-align:center;position:relative;overflow:hidden;min-height:230px;
  }
  .speech{
    background:#fff;border-radius:16px 16px 16px 4px;
    padding:12px 16px;font-size:13.5px;font-weight:600;color:#15161C;
    display:inline-block;text-align:left;box-shadow:var(--shadow);position:relative;z-index:2;
  }
  .mascot{width:170px;height:162px;margin:6px auto -8px;display:block}
  .stats{display:flex;gap:12px;margin-top:16px}
  .stat{
    flex:1;background:var(--card);border-radius:18px;padding:12px 16px;
    box-shadow:var(--shadow);text-align:left;
  }
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stat .val{font-size:20px;font-weight:700;color:var(--text);margin-top:2px}
  .stat .bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
  .stat .bar i{display:block;height:100%;border-radius:3px;transition:width .4s}

  .card-panel{background:var(--card);border-radius:var(--r-card);padding:18px;margin-top:16px;box-shadow:var(--shadow)}
  .card-panel h4{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}

  .timer-wrap{text-align:center;padding:8px 0 4px}
  .timer-ring{position:relative;width:190px;height:190px;margin:6px auto}
  .timer-ring svg{transform:rotate(-90deg)}
  .timer-ring .track{stroke:var(--line)}
  .timer-ring .prog{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
  .timer-num{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .timer-num b{font-size:44px;font-weight:700;color:var(--text);letter-spacing:-1px}
  .timer-num span{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .dur-row{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
  .big-btn{
    width:100%;padding:17px;border-radius:var(--r-pill);
    background:var(--nav-dark);color:#F6F6F9;font-size:15px;font-weight:700;
    margin-top:14px;
  }
  .big-btn.go{background:var(--blue)}
  .sub-note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;font-weight:500}
  .focus-done{
    display:none;background:var(--green);border-radius:var(--r-card);
    padding:24px;text-align:center;margin-top:16px;color:#15161C;
  }
  .focus-done.show{display:block;animation:pop .4s ease}
  .focus-done h3{font-size:22px;font-weight:700}
  .focus-done p{font-size:14px;margin-top:6px;opacity:.8}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

  /* ============ 3 · JADWAL ============ */
  .sched-head{padding-top:14px}
  .sched-head .mo{font-size:14px;color:var(--muted);font-weight:500}
  .sched-head h1{font-size:36px;font-weight:700;color:var(--text);letter-spacing:-.5px}
  .week{display:flex;gap:4px;margin-top:16px;justify-content:space-between}
  .wd{
    flex:1;text-align:center;cursor:pointer;padding:6px 0;border-radius:14px;
    transition:all .2s;
  }
  .wd small{font-size:12.5px;color:var(--muted);font-weight:500;display:block}
  .wd b{font-size:17px;color:var(--text);font-weight:700;display:block;margin-top:5px}
  .wd.on small{color:var(--blue);font-weight:700}
  .wd.on b{color:var(--blue)}
  .wd.on b::after{
    content:"";display:block;width:5px;height:5px;border-radius:50%;
    background:var(--blue);margin:3px auto 0;
  }

  .timeline{margin-top:22px;position:relative}
  .tl-item{display:flex;gap:16px;position:relative;padding-bottom:18px}
  .tl-rail{width:20px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .tl-dot{
    width:18px;height:18px;border-radius:50%;border:2.5px solid var(--blue);
    background:var(--bg);flex-shrink:0;transition:all .25s;cursor:pointer;position:relative;z-index:2;
  }
  .tl-item.done .tl-dot{background:var(--blue)}
  .tl-item.now .tl-dot{box-shadow:0 0 0 5px rgba(67,146,240,.22);background:var(--blue)}
  .tl-line{width:2.5px;flex:1;background:var(--blue);opacity:.5;min-height:24px}
  .tl-item:last-child .tl-line{display:none}
  .tl-body{
    flex:1;background:var(--card);border-radius:18px;padding:15px 17px;
    cursor:pointer;transition:transform .15s,background .25s,box-shadow .25s;
  }
  .tl-body:active{transform:scale(.98)}
  .tl-body .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tl-body h3{font-size:16px;font-weight:700;color:var(--text)}
  .tl-body .time{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .tl-body p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
  .tl-item.now .tl-body{background:var(--blue);box-shadow:0 10px 26px rgba(67,146,240,.35)}
  .tl-item.now .tl-body h3,.tl-item.now .tl-body .time{color:#fff}
  .tl-item.now .tl-body p{color:rgba(255,255,255,.85)}
  .tl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .tl-foot .avatars span{border-color:#4392F0}
  .tl-item.now .avatars span{border-color:#4392F0}
  .mini-load{
    width:42px;height:42px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .mini-load i{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid var(--blue);border-top-color:transparent;
    display:block;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .fab{
    position:absolute;left:50%;bottom:104px;transform:translateX(-50%);
    width:60px;height:60px;border-radius:22px;border:none;cursor:pointer;
    background:var(--blue);box-shadow:0 12px 28px rgba(67,146,240,.45);
    display:flex;align-items:center;justify-content:center;z-index:40;
    transition:transform .18s;
  }
  .fab:active{transform:translateX(-50%) scale(.92)}
  .fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}

  /* ============ 4 · TUGAS (gelap) ============ */
  #s-tasks{background:transparent}
  .tasks-head{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
  .tasks-head h2{font-size:18px;font-weight:700;color:var(--text)}
  .ghost{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:transparent;display:flex;align-items:center;justify-content:center;
  }
  .ghost svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .month-sel{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:20px;cursor:pointer;
  }
  .month-sel b{font-size:24px;font-weight:700;color:var(--text)}
  .month-sel svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round}
  .dstrip{display:flex;gap:10px;margin-top:18px;justify-content:center;overflow:hidden}
  .dcard{
    width:62px;height:96px;border-radius:32px;flex-shrink:0;cursor:pointer;
    background:var(--card);display:flex;flex-direction:column;
    align-items:center;justify-content:center;transition:all .22s;opacity:.55;
  }
  .dcard b{font-size:20px;font-weight:700;color:var(--text)}
  .dcard small{font-size:13px;color:var(--muted);margin-top:3px}
  .dcard.on{background:var(--green);opacity:1;transform:scale(1.12)}
  .dcard.on b{color:#15161C}
  .dcard.on small{color:#15161C;opacity:.75}

  .tgroup{margin-top:26px;position:relative;padding-left:64px}
  .tgroup .tl-time{
    position:absolute;left:0;top:0;font-size:15px;font-weight:600;color:var(--text);line-height:1.3;
  }
  .tgroup .tl-time i{
    display:block;width:1.5px;height:56px;background:var(--muted);
    opacity:.5;margin:6px 0 6px 8px;
  }
  .tcard{
    background:var(--tc,#C5EE93);border-radius:20px;padding:18px 16px;
    cursor:pointer;transition:transform .15s;position:relative;
  }
  .tcard:active{transform:scale(.98)}
  .tcard .tab{
    position:absolute;top:-16px;left:16px;background:var(--tc,#C5EE93);
    border-radius:12px 12px 0 0;padding:5px 14px 7px;
    font-size:12.5px;font-weight:700;color:#15161C;
  }
  .tcard .meta-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:-6px;padding-top:2px;
  }
  .tcard .avatars span{border-color:var(--tc,#C5EE93);width:28px;height:28px;font-size:10px}
  .tcard .avatars .add{background:#152030;color:#fff}
  .prog-wrap{display:flex;align-items:center;gap:8px}
  .prog-wrap .track{width:56px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);overflow:hidden}
  .prog-wrap .track i{display:block;height:100%;background:#152030;border-radius:3px}
  .prog-wrap span{font-size:12.5px;font-weight:700;color:#152030}
  .tcard .body{display:flex;align-items:center;gap:14px;margin-top:14px}
  .ticon{
    width:54px;height:54px;flex-shrink:0;border-radius:18px;background:#152030;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(45deg);border-radius:16px;
  }
  .ticon svg{width:24px;height:24px;stroke:var(--tc,#C5EE93);fill:none;stroke-width:2;stroke-linecap:round;transform:rotate(-45deg)}
  .tinfo{flex:1;min-width:0}
  .tinfo h3{font-size:18px;font-weight:700;color:#15161C}
  .tinfo p{font-size:13.5px;color:#15161C;opacity:.6;margin-top:2px}
  .dots{font-size:22px;color:#15161C;letter-spacing:1px;line-height:1;cursor:pointer;padding:4px}

  /* ============ THEME TOGGLE ============ */
  .theme-fab{
    position:absolute;top:60px;right:16px;z-index:70;
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:var(--card);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:transform .2s;
  }
  .theme-fab:active{transform:scale(.9)}

  /* toast */
  .toast{
    position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:var(--nav-dark);color:#F6F6F9;font-size:13.5px;font-weight:600;
    padding:12px 22px;border-radius:var(--r-pill);z-index:80;
    opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Mobile: buang chrome mockup (notch/statusbar/home-ind) -> full layar + dvh */
  @media (max-width:520px){
    html,body{height:auto;min-height:100dvh}
    .phone{height:100vh;height:100dvh}
    .notch,.statusbar,.home-ind{display:none}

  }
</style>
</head>

<script>
/* ============ THEME ============ */
let forcedTheme = null; // null = otomatis per-halaman
let manual = false;
function setTheme(mode, auto){
  if(auto && manual) return;
  document.getElementById('phone').dataset.theme = mode;
  document.getElementById('themeBtn').textContent = mode === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  manual = true;
  const cur = document.getElementById('phone').dataset.theme;
  forcedTheme = cur === 'dark' ? 'light' : 'dark';
  setTheme(forcedTheme, false);
  toast(forcedTheme === 'dark' ? 'Mode gelap' : 'Mode terang');
});


/* ============ TOAST ============ */
let toastT;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1800);
}


/* ============ BERANDA ============ */
document.getElementById('dateStrip').addEventListener('click', e => {
  const b = e.target.closest('.day'); if(!b) return;
  document.querySelectorAll('#dateStrip .day').forEach(d => d.classList.remove('on'));
  b.classList.add('on');
});


setTheme('light', true);
</script>
